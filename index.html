<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Klicky — Encurtador de Links</title>
  <link rel="icon" type="image/png" href="flaticon.png" />
  
  <!-- Fontes próximas ao Blacker Sans (substitua depois pelas oficiais se tiver a licença) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --purple: #9259E7;
      --pink: #FAB5D4;
      --blue: #42B2FC;
      --green: #77E0B5;
      --pink2: #F182AD;
      --gray: #D1D5D6;
      --dark: #4B4B4D;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: 'Outfit', system-ui, sans-serif;
      background: linear-gradient(160deg, #9259E7 0%, #FAB5D4 100%);
      background-attachment: fixed;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* Card estilo celular */
    .phone-card {
      width: 100%;
      max-width: 380px;
      background: #ffffff;
      border-radius: 28px;
      padding: 40px 32px 28px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      text-align: center;
      position: relative;
    }

    /* Logo */
    .logo {
      margin-bottom: 18px;
    }

    .logo img {
      width: 220px;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    /* Frase */
    .tagline {
      font-size: 15px;
      line-height: 1.45;
      color: #4B4B4D;
      font-weight: 500;
      margin-bottom: 28px;
      padding: 0 8px;
    }

    .tagline strong {
      font-weight: 700;
    }

    /* Título Login */
    .login-title {
      font-size: 18px;
      font-weight: 700;
      color: #4B4B4D;
      margin-bottom: 18px;
    }

    /* Inputs */
    .form-group {
      margin-bottom: 12px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 14px 18px;
      border: none;
      border-radius: 50px;
      background: #E8E8E8;
      font-family: inherit;
      font-size: 15px;
      color: #4B4B4D;
      outline: none;
      transition: background 0.2s;
    }

    input::placeholder {
      color: #9CA3AF;
    }

    input:focus {
      background: #dedede;
    }

    /* Botão Login */
    .btn-login {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      border: none;
      border-radius: 50px;
      background: linear-gradient(90deg, #9259E7 0%, #F182AD 100%);
      color: white;
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .btn-login:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(146, 89, 231, 0.35);
    }

    .btn-login:active {
      transform: translateY(0);
    }

    /* Forgot */
    .forgot {
      display: block;
      margin-top: 14px;
      font-size: 13px;
      color: #6B7280;
      text-decoration: none;
    }

    .forgot:hover {
      color: #9259E7;
    }

    /* Barra de cores + rodapé */
    .footer {
      margin-top: 28px;
      padding-top: 18px;
    }

    .color-bar {
      display: flex;
      height: 4px;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .color-bar span {
      flex: 1;
    }

    .footer-text {
      font-size: 11px;
      color: #9CA3AF;
      line-height: 1.4;
    }

    /* Responsivo */
    @media (max-width: 420px) {
      .phone-card {
        padding: 32px 24px 24px;
        border-radius: 24px;
      }
      .logo img {
        width: 190px;
      }
      .tagline {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>

  <div class="phone-card">
    <!-- Logo -->
    <div class="logo">
      <img src="logo_klicly.png" alt="Klicky!" />
    </div>

    <!-- Frase -->
    <p class="tagline">
      Encurte seus links da sua<br>
      presença digital de forma rápida,<br>
      profissional e amigável!
    </p>

    <!-- Login -->
    <h2 class="login-title">User Login</h2>

    <form id="loginForm">
      <div class="form-group">
        <input type="text" id="username" placeholder="Username" required autocomplete="username" />
      </div>
      <div class="form-group">
        <input type="password" id="password" placeholder="Password" required autocomplete="current-password" />
      </div>

      <button type="submit" class="btn-login">LOGIN</button>
    </form>

    <a href="#" class="forgot">Forgot Username or Password?</a>

    <!-- Rodapé -->
    <div class="footer">
      <div class="color-bar">
        <span style="background:#9259E7"></span>
        <span style="background:#FAB5D4"></span>
        <span style="background:#42B2FC"></span>
        <span style="background:#77E0B5"></span>
        <span style="background:#F182AD"></span>
        <span style="background:#D1D5D6"></span>
      </div>
      <p class="footer-text">
        Klicky is a Dhel Studio brand © 2026<br>
        All rights reserved. Version 1.0
      </p>
    </div>
  </div>

  <script>
    // Login temporário (interno)
    // Senha padrão enquanto não temos autenticação real:
    // usuário: admin   |   senha: klicky2026

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value;

      // Validação simples (pode trocar depois)
      if (user === 'andrehdhel' && pass === 'klicky@81036288') {
        // Redireciona para a página de encurtar links
        window.location.href = 'app.html';
      } else {
        alert('Usuário ou senha incorretos.');
      }
    });
  </script>
</body>
</html>
