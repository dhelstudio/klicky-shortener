<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Klicky — Encurtador de Links</title>
  <link rel="icon" type="image/png" href="flaticon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0b;
      --surface: #141416;
      --surface-2: #1c1c1f;
      --border: #2a2a2e;
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
      --primary: #9259E7;
      --primary-hover: #7c3aed;
      --success: #22c55e;
      --radius: 12px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .container {
      max-width: 640px;
      margin: 0 auto;
      padding: 2rem 1.25rem;
    }
    header {
      text-align: center;
      margin-bottom: 2.5rem;
      padding-top: 1.5rem;
    }
    .logo {
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #a78bfa, #9259E7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }
    .tagline { color: var(--text-muted); font-size: 0.95rem; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.75rem;
      margin-bottom: 1.5rem;
    }
    .card h2 { font-size: 1.15rem; font-weight: 600; margin-bottom: 1.25rem; }
    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
    }
    input[type="url"], input[type="text"] {
      width: 100%;
      padding: 0.85rem 1rem;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.95rem;
      font-family: inherit;
      margin-bottom: 1rem;
    }
    input:focus { outline: none; border-color: var(--primary); }
    input::placeholder { color: #52525b; }
    .optional { font-weight: 400; color: #71717a; }
    .btn {
      width: 100%;
      padding: 0.9rem 1.5rem;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
    }
    .btn:hover { background: var(--primary-hover); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .result {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .result.show { display: block; }
    .result-label { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.5rem; }
    .result-url { display: flex; gap: 0.5rem; align-items: center; }
    .result-url input {
      margin-bottom: 0;
      flex: 1;
      font-weight: 500;
      color: var(--primary);
    }
    .btn-copy {
      width: auto;
      padding: 0.75rem 1.1rem;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-copy.copied { background: var(--success); border-color: var(--success); color: white; }
    .result-meta { margin-top: 1rem; font-size: 0.85rem; color: var(--text-muted); word-break: break-all; }
    .error-msg {
      display: none;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      padding: 0.85rem 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      font-size: 0.9rem;
    }
    .error-msg.show { display: block; }
    .recent { margin-top: 2rem; }
    .recent h3 { font-size: 0.95rem; font-weight: 600; color: var(--text-muted); margin-bottom: 1rem; }
    .link-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.9rem 1rem;
      margin-bottom: 0.6rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      font-size: 0.9rem;
    }
    .link-item a { color: var(--primary); text-decoration: none; font-weight: 500; }
    .link-clicks { color: var(--text-muted); font-size: 0.8rem; white-space: nowrap; }
    .original-preview {
      color: var(--text-muted);
      font-size: 0.8rem;
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    footer {
      text-align: center;
      margin-top: 3rem;
      padding-bottom: 2rem;
      color: var(--text-muted);
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">klicky</div>
      <p class="tagline">Encurte links com a sua marca. Simples, rápido e profissional.</p>
    </header>

    <div class="card">
      <h2>Criar link curto</h2>
      <div id="error" class="error-msg"></div>
      <form id="form">
        <label for="url">URL longa *</label>
        <input type="url" id="url" placeholder="https://exemplo.com/pagina-muito-longa..." required />
        <label for="customCode">Código personalizado <span class="optional">(opcional)</span></label>
        <input type="text" id="customCode" placeholder="ex: promo-verao" maxlength="30" />
        <label for="title">Título / Nome do link <span class="optional">(opcional)</span></label>
        <input type="text" id="title" placeholder="ex: Página de vendas - Cliente X" maxlength="100" />
        <button type="submit" class="btn" id="btnSubmit">Encurtar link</button>
      </form>
    </div>

    <div id="result" class="result">
      <div class="result-label">Seu link curto:</div>
      <div class="result-url">
        <input type="text" id="shortUrl" readonly />
        <button type="button" class="btn btn-copy" id="btnCopy">Copiar</button>
      </div>
      <div class="result-meta" id="originalPreview"></div>
    </div>

    <div class="recent" id="recentSection" style="display:none;">
      <h3>Últimos links criados</h3>
      <div id="recentList"></div>
    </div>

    <footer>Klicky · Dhel Studio © 2026</footer>
  </div>

  <script>
    const form = document.getElementById('form');
    const btnSubmit = document.getElementById('btnSubmit');
    const errorEl = document.getElementById('error');
    const resultEl = document.getElementById('result');
    const shortUrlInput = document.getElementById('shortUrl');
    const originalPreview = document.getElementById('originalPreview');
    const btnCopy = document.getElementById('btnCopy');
    const recentSection = document.getElementById('recentSection');
    const recentList = document.getElementById('recentList');

    loadRecent();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.classList.remove('show');
      resultEl.classList.remove('show');
      btnSubmit.disabled = true;
      btnSubmit.textContent = 'Gerando...';

      const payload = {
        url: document.getElementById('url').value.trim(),
        customCode: document.getElementById('customCode').value.trim() || undefined,
        title: document.getElementById('title').value.trim() || undefined
      };

      try {
        const res = await fetch('/api/shorten', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Erro ao criar link');

        shortUrlInput.value = data.short_url;
        originalPreview.textContent = `Destino: ${data.original_url}`;
        resultEl.classList.add('show');
        document.getElementById('customCode').value = '';
        document.getElementById('title').value = '';
        loadRecent();
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.classList.add('show');
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.textContent = 'Encurtar link';
      }
    });

    btnCopy.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(shortUrlInput.value);
        btnCopy.textContent = 'Copiado!';
        btnCopy.classList.add('copied');
        setTimeout(() => {
          btnCopy.textContent = 'Copiar';
          btnCopy.classList.remove('copied');
        }, 2000);
      } catch {
        shortUrlInput.select();
        document.execCommand('copy');
      }
    });

    async function loadRecent() {
      try {
        const res = await fetch('/api/links');
        const links = await res.json();
        if (!links.length) {
          recentSection.style.display = 'none';
          return;
        }
        recentSection.style.display = 'block';
        recentList.innerHTML = links.slice(0, 8).map(l => `
          <div class="link-item">
            <div>
              <a href="${l.short_url}" target="_blank">${l.short_url}</a>
              <div class="original-preview">${l.title || l.original_url}</div>
            </div>
            <div class="link-clicks">${l.clicks} clique${l.clicks !== 1 ? 's' : ''}</div>
          </div>
        `).join('');
      } catch {}
    }
  </script>
</body>
</html>
